name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp -C packages/vite pack
      - run: pnpm exec vp check
      # playwright は @flat-html/elements の依存なので、その文脈で実行する
      - run: pnpm --filter @flat-html/elements exec playwright install --with-deps chromium
      - run: pnpm exec vp run -r test
      - run: pnpm exec vp -C apps/site build
